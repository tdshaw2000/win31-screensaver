# Builds WIN31SS.SCR on a GitHub-hosted runner.
#
# Deliberately NO Docker layer cache. The OpenWatcom snapshot tag is pinned
# (see Dockerfile), so a cache isn't servicing a rolling-tag risk - and
# public repos get free unlimited hosted-runner minutes, so the ~30-60s cold
# download has no cost to offset. See README.md's CI section for the full
# rationale before adding one.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build WIN31SS.SCR
        run: |
          docker build -t win31ss-build .
          docker create --name extract win31ss-build make
          docker start -a extract
          docker cp extract:/work/WIN31SS.SCR ./WIN31SS.SCR
          docker rm extract

      - uses: actions/upload-artifact@v4
        with:
          name: WIN31SS.SCR
          path: WIN31SS.SCR
