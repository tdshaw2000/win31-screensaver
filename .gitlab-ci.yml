# Single build stage: build the OpenWatcom toolchain image from the
# Dockerfile in this repo, cross-compile WIN31SS.SCR inside it, and
# publish the .SCR as a job artifact.
#
# Runs on a local shell-executor runner (tag "win31ss-local") talking
# directly to its host's Docker daemon - not GitLab.com's shared runners.
# The "win31ss-local" tag isn't tied to one machine: it's registered on
# two personal machines (a home PC and a work laptop), with only one
# enabled at a time, toggled manually to compare reliability between
# them. Whichever is live has the OpenWatcom snapshot layer cached from
# local `make`/`docker build` runs, so pipelines build faster than a
# shared runner would (no re-download of the snapshot each run) and
# don't spend shared-runner CI minutes. The job still builds the image
# fresh each run rather than pulling a pre-built one from the registry,
# so the toolchain always matches the Dockerfile committed in this repo
# - Docker's layer cache makes that cheap here since nothing needs
# re-downloading when the Dockerfile is unchanged.

stages:
  - build

build-scr:
  stage: build
  tags:
    - win31ss-local
  script:
    # Temporary diagnostics for the intermittent "permission denied ...
    # docker.sock" failures on win31ss-local - remove once root-caused.
    - id
    - groups
    - cat /proc/self/status | grep -i groups
    - docker build -t win31ss-build .
    - docker create --name extract win31ss-build make
    - docker start -a extract
    - docker cp extract:/work/WIN31SS.SCR ./WIN31SS.SCR
    - docker rm extract
  artifacts:
    paths:
      - WIN31SS.SCR
    expire_in: 30 days
